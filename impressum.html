        a:hover { text-decoration: underline; }
        .back-link { display: inline-block; margin-bottom: 20px; font-size: 14px; }
        .lang-switcher { display: flex; gap: 6px; align-items: center; justify-content: center; margin: 20px 0; }
        .lang-btn { background: none; border: 1px solid transparent; cursor: pointer; font-size: 22px; padding: 4px 8px; border-radius: 6px; opacity: 0.5; transition: all 0.2s; line-height: 1; }
        .lang-btn.active { opacity: 1; border-color: rgba(255,255,255,0.2); }
        .lang-btn:hover { opacity: 1; }
        .law-note { font-size: 13px; color: #999; font-style: italic; margin-bottom: 16px; }
    </style>
</head>

            },

                disputeHeading: 'Resoluci\u00f3n de Disputas de la UE',

            }
        };

        const titleMap = {
            de: 'YouHold \u2013 Impressum',
            en: 'YouHold \u2013 Legal Notice',
            es: 'YouHold \u2013 Aviso Legal',
            fr: 'YouHold \u2013 Mentions L\u00e9gales'
        };

        function setLanguage(lang) {
            if (!translations[lang]) lang = 'de';
            const t = translations[lang];

            document.querySelectorAll('[data-i18n]').forEach(function(el) {
                var key = el.getAttribute('data-i18n');
                if (t[key] !== undefined) {
                    el.textContent = t[key];
                }
            });

            document.querySelectorAll('[data-i18n-html]').forEach(function(el) {
                var key = el.getAttribute('data-i18n-html');
                if (t[key] !== undefined) {
                    el.innerHTML = t[key];
                }
            });

            // Show/hide law note for non-German languages
            var lawNoteEl = document.querySelector('[data-i18n="lawNote"]');
            if (lawNoteEl) {
                lawNoteEl.style.display = (lang === 'de') ? 'none' : 'block';
            }

            // Update page title and lang attribute
            document.title = titleMap[lang] || titleMap['de'];
            document.documentElement.lang = lang;

            // Update active button
            document.querySelectorAll('.lang-btn').forEach(function(btn) {
                btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
            });

            // Persist choice
            try { localStorage.setItem('youhold-lang', lang); } catch(e) {}
        }

        function detectLanguage() {
            // 1. Check localStorage
            try {
                var saved = localStorage.getItem('youhold-lang');
                if (saved && translations[saved]) return saved;
            } catch(e) {}

            // 2. Check browser language
            var browserLang = (navigator.language || navigator.userLanguage || 'de').substring(0, 2).toLowerCase();
            if (translations[browserLang]) return browserLang;

            // 3. Default to German
            return 'de';
        }

        // Bind click events
        document.querySelectorAll('.lang-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                setLanguage(this.getAttribute('data-lang'));
            });
        });

        // Initialize
        setLanguage(detectLanguage());
    </script>
</body>
</html>
