<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouHold – Seite nicht gefunden</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0A0A0F;
            color: #F0F0F5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container { max-width: 480px; }
        .code {
            font-size: 96px;
            font-weight: 700;
            background: linear-gradient(135deg, #2979FF, #00E676);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 16px;
        }
        h1 { font-size: 24px; margin-bottom: 12px; }
        p { color: #8888A0; font-size: 16px; margin-bottom: 32px; line-height: 1.6; }
        a {
            display: inline-block;
            background: #2979FF;
            color: white;
            padding: 14px 28px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s;
        }
        a:hover { background: #448AFF; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="container">
        <div class="code">404</div>
        <h1>Seite nicht gefunden</h1>
        <p>Die gesuchte Seite existiert nicht oder wurde verschoben.</p>
        <a href="/">Zur Startseite</a>
    </div>
</body>
</html>
